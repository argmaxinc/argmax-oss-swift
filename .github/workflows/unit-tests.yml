name: Unit Tests

on:
  workflow_call:
    inputs:
      ios-version:
        required: true
        type: string
      ios-device:
        required: true
        type: string
      watchos-version:
        required: true
        type: string
      visionos-version:
          required: true
          type: string
      macos-runner:
        required: true
        type: string
      xcode-version:
        required: false
        type: string
      model-cache-key:
        required: true
        type: string
    secrets:
      HF_TOKEN:
        required: false

jobs:
  unit-tests:
    name: "${{ matrix.run-config['name'] }} on ${{ inputs.macos-runner }}"
    runs-on: ${{ inputs.macos-runner }}
    strategy:
      matrix:
        run-config:
          - {
              name: "macOS",
              condition: true,
              test-destination: "platform=macOS,arch=arm64",
            }
          - {
              name: "iOS",
              condition: true,
              os-version: "${{ inputs.ios-version }}",
              device: "${{ inputs.ios-device }}",
              test-destination: "platform=iOS Simulator,OS=${{ inputs.ios-version }},name=${{ inputs.ios-device }}",
            }
          - {
              name: "watchOS",
              condition: "${{ inputs.macos-runner == 'xcode-27' }}",
              os-version: "${{ inputs.watchos-version }}",
              device: "Apple Watch Ultra 4 (49mm)",
              test-destination: "platform=watchOS Simulator,OS=${{ inputs.watchos-version }},name=Apple Watch Ultra 4 (49mm)",
            }
          - {
              name: "visionOS",
              condition: "${{ inputs.macos-runner == 'xcode-27' }}",
              os-version: "${{ inputs.visionos-version }}",
              device: "Apple Vision Pro",
              test-destination: "platform=visionOS Simulator,OS=${{ inputs.visionos-version }},name=Apple Vision Pro",
            }
    timeout-minutes: ${{ matrix.run-config['name'] == 'visionOS' && 60 || 30 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd #v5.0.1
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version || '26.4.1' }}
      - name: Setup environment
        run: make setup
      - name: Setup Cache
        if: ${{ matrix.run-config['condition'] == true }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: Models
          key: ${{ inputs.model-cache-key }}
      - name: Install and discover destinations
        if: ${{ matrix.run-config['condition'] == true }}
        run: |
          echo "Simulators on runner:"
          xcrun simctl list
          if [[ "${{ matrix.run-config['name'] }}" == "visionOS" ]]; then
            xcodebuild -downloadPlatform ${{ matrix.run-config['name'] }}
          fi
          echo "Runtimes for testing:"
          xcrun simctl list runtimes
          echo "Destinations for testing:"
          xcodebuild test-without-building -testPlan UnitTestsPlan -scheme argmax-oss-swift-Package -showdestinations
      - name: Boot Simulator and Wait
        if: ${{ matrix.run-config['condition'] == true && matrix.run-config['name'] != 'macOS' && inputs.macos-runner == 'xcode-27' }}
        timeout-minutes: 5
        continue-on-error: true
        # Slower runners require some time to fully boot the simulator
        # Boot the simulator for the requested OS and device, and wait
        env:
          PLATFORM: ${{ matrix.run-config['name'] }}
          OS: ${{ matrix.run-config['os-version'] }}
          DEVICE: ${{ matrix.run-config['device'] }}
        run: |
          udid=$(xcrun simctl list -j | jq -r '(.runtimes[] | select(.isAvailable and (.name | startswith(env.PLATFORM + " ")) and .version == env.OS) | .identifier) as $runtime | .devices[$runtime][]? | select(.isAvailable and .name == env.DEVICE) | .udid' | head -1)
          xcrun simctl bootstatus "${udid:-$DEVICE}" -b
      - name: Build - ${{ matrix.run-config['name'] }}
        if: ${{ matrix.run-config['condition'] == true }}
        run: |
          set -o pipefail
          # Annotate warnings from a single job only; duplicate check runs each re-post identical annotations on the PR diff
          xcodebuild clean build-for-testing -testPlan UnitTestsPlan -scheme argmax-oss-swift-Package -destination '${{ matrix.run-config['test-destination'] }}' | xcbeautify --renderer ${{ (matrix.run-config['name'] == 'macOS' && inputs.macos-runner == 'xcode-27') && 'github-actions' || 'terminal' }}
          xcodebuild build -scheme argmax-oss-swift-Package -destination 'generic/platform=${{ matrix.run-config['name'] }}' -derivedDataPath "$RUNNER_TEMP/generic-build" | xcbeautify
      - name: Test - ${{ matrix.run-config['name'] }}
        if: ${{ matrix.run-config['condition'] == true }}
        env:
          # xcodebuild strips the TEST_RUNNER_ prefix and forwards these into the test process
          TEST_RUNNER_HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST_RUNNER_WHISPERKIT_TINY_MODEL_PATH: ${{ github.workspace }}/Models/whisperkit-coreml/openai_whisper-tiny
        run: |
          set -o pipefail
          xcodebuild test-without-building -testPlan UnitTestsPlan -scheme argmax-oss-swift-Package -destination '${{ matrix.run-config['test-destination'] }}' -collect-test-diagnostics never | xcbeautify
      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: test-results-${{ matrix.run-config['name']}}-on-${{ inputs.macos-runner }}
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 5

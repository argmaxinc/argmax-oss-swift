name: Bump Homebrew Formula

on:
  push:
    tags: 'v*'

jobs:
  homebrew:
    runs-on: ubuntu-latest
    steps:
      - uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 #v4.2
        with:
          formula-name: whisperkit-cli
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
